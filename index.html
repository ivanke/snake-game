<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>貪食蛇 Snake Game</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #10141c;
    --panel: #1a2130;
    --border: #2a3346;
    --accent: #4ade80;
    --accent2: #22c55e;
    --food: #f87171;
    --text: #e5e9f0;
    --muted: #8892a6;
  }
  * { box-sizing: border-box; }
  html, body {
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(circle at top, #1b2436, var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 1px;
    text-align: center;
  }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 16px;
    color: var(--muted);
  }
  .hud span {
    color: var(--accent);
    font-weight: 700;
  }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: min(400px, 92vw);
    width: min(400px, 92dvw);
  }
  canvas {
    display: block;
    background: #0d1117;
    border-radius: 6px;
    image-rendering: pixelated;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 10px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(10, 13, 20, 0.85);
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 24px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    background: var(--accent2);
    color: #06210f;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  button:hover { background: var(--accent); }
  button:active { transform: scale(0.96); }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .controls p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 6px;
  }
  .dpad button {
    padding: 0;
    font-size: 20px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    touch-action: manipulation;
  }
  .dpad button:hover { background: var(--border); }
  .dpad button:active { background: var(--border); }
  /* show the on-screen D-pad on touch devices and narrow screens */
  @media (max-width: 560px), (hover: none) and (pointer: coarse) {
    .dpad { display: grid; }
    .swipe-hint { display: block; }
    .key-hint { display: none; }
  }
  .swipe-hint { display: none; }
  @media (max-width: 480px), (max-height: 700px) {
    body { padding: 12px; gap: 10px; }
    h1 { font-size: 20px; }
    .hud { font-size: 14px; gap: 18px; }
    .controls p { font-size: 12px; }
    .dpad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
  }
</style>
</head>
<body>
  <h1>🐍 貪食蛇 Snake Game</h1>
  <div class="hud">
    <div>分數 Score: <span id="score">0</span></div>
    <div>最高分 Best: <span id="best">0</span></div>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">貪食蛇</h2>
      <p id="overlayText">按空白鍵或方向鍵開始遊戲</p>
      <button id="startBtn">開始遊戲 Start</button>
    </div>
  </div>

  <div class="controls">
    <p class="key-hint">方向鍵 / WASD 移動　｜　空白鍵：暫停 / 繼續</p>
    <p class="swipe-hint">在畫面上滑動控制方向　｜　輕點畫面：暫停 / 繼續</p>
    <div class="dpad" id="dpad">
      <span></span><button data-dir="up">↑</button><span></span>
      <button data-dir="left">←</button><span></span><button data-dir="right">→</button>
      <span></span><button data-dir="down">↓</button><span></span>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const dpad = document.getElementById('dpad');

  const GRID = 20;
  const CELLS = canvas.width / GRID;
  const BEST_KEY = 'snake_best_score';

  let snake, dir, nextDir, food, score, best, speedMs, timer, running, paused;

  function loadBest() {
    return Number(localStorage.getItem(BEST_KEY) || 0);
  }

  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }

  function randCell() {
    return Math.floor(Math.random() * CELLS);
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: randCell(), y: randCell() };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function resetState() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speedMs = 130;
    scoreEl.textContent = score;
    placeFood();
  }

  function draw() {
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid subtle lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i <= CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * GRID);
      ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }

    // food
    ctx.fillStyle = '#f87171';
    roundRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4, 5);

    // snake
    const len = snake.length;
    snake.forEach((seg, i) => {
      const x = seg.x * GRID;
      const y = seg.y * GRID;
      if (i === 0) {
        drawHead(x, y, dir);
      } else if (i === len - 1 && len > 1) {
        const tailDir = segDir(snake[i - 1], seg);
        drawTail(x, y, tailDir);
      } else {
        ctx.fillStyle = '#22c55e';
        roundRect(x + 1, y + 1, GRID - 2, GRID - 2, 4);
      }
    });
  }

  // direction from cell a to adjacent cell b, accounting for wall-wrap
  function segDir(a, b) {
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    if (dx > 1) dx -= CELLS; else if (dx < -1) dx += CELLS;
    if (dy > 1) dy -= CELLS; else if (dy < -1) dy += CELLS;
    return { x: dx, y: dy };
  }

  function drawHead(x, y, facing) {
    ctx.fillStyle = '#4ade80';
    roundRect(x + 1, y + 1, GRID - 2, GRID - 2, 6);

    // eyes, offset toward the direction the head is facing
    const cx = x + GRID / 2;
    const cy = y + GRID / 2;
    const perp = { x: -facing.y, y: facing.x };
    const fwd = GRID * 0.18;
    const side = GRID * 0.16;
    const r = 1.8;

    [1, -1].forEach((s) => {
      const ex = cx + facing.x * fwd + perp.x * side * s;
      const ey = cy + facing.y * fwd + perp.y * side * s;
      ctx.fillStyle = '#0d1117';
      ctx.beginPath();
      ctx.arc(ex, ey, r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawTail(x, y, tailDir) {
    ctx.fillStyle = '#4ade80';
    if (!tailDir.x && !tailDir.y) {
      roundRect(x + 1, y + 1, GRID - 2, GRID - 2, 4);
      return;
    }
    const cx = x + GRID / 2;
    const cy = y + GRID / 2;
    const half = GRID / 2 - 1;
    const tip = { x: cx + tailDir.x * half, y: cy + tailDir.y * half };
    const baseCenter = { x: cx - tailDir.x * half, y: cy - tailDir.y * half };
    const perp = { x: -tailDir.y, y: tailDir.x };
    const baseHalfWidth = GRID / 2 - 2;
    const p1 = { x: baseCenter.x + perp.x * baseHalfWidth, y: baseCenter.y + perp.y * baseHalfWidth };
    const p2 = { x: baseCenter.x - perp.x * baseHalfWidth, y: baseCenter.y - perp.y * baseHalfWidth };

    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function step() {
    dir = nextDir;
    const head = {
      x: (snake[0].x + dir.x + CELLS) % CELLS,
      y: (snake[0].y + dir.y + CELLS) % CELLS
    };

    // self collision (walls wrap around instead of killing the snake)
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        saveBest(best);
      }
      placeFood();
      speedMs = Math.max(60, speedMs - 3);
      restartTimer();
    } else {
      snake.pop();
    }

    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speedMs);
  }

  function showOverlay(title, text, btnLabel) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    startBtn.textContent = btnLabel;
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function startGame() {
    resetState();
    running = true;
    paused = false;
    hideOverlay();
    draw();
    restartTimer();
  }

  function gameOver() {
    clearInterval(timer);
    running = false;
    showOverlay('遊戲結束 Game Over', `分數：${score}　按開始重新挑戰`, '再玩一次 Restart');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      showOverlay('已暫停 Paused', '按空白鍵或按鈕繼續', '繼續 Resume');
    } else {
      hideOverlay();
      restartTimer();
    }
  }

  function setDirection(x, y) {
    // prevent reversing directly into itself
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W':
        e.preventDefault(); setDirection(0, -1); break;
      case 'ArrowDown': case 's': case 'S':
        e.preventDefault(); setDirection(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A':
        e.preventDefault(); setDirection(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D':
        e.preventDefault(); setDirection(1, 0); break;
      case ' ':
        e.preventDefault();
        if (!running) startGame(); else togglePause();
        break;
    }
  });

  dpad.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const [x, y] = map[btn.dataset.dir];
    setDirection(x, y);
  });

  startBtn.addEventListener('click', () => {
    if (!running) startGame(); else togglePause();
  });

  // touch / swipe controls for mobile (no arrow keys on a touchscreen)
  let touchStartX = 0;
  let touchStartY = 0;
  let touchTracking = false;
  const SWIPE_THRESHOLD = 24; // px, below this it's treated as a tap

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchTracking = true;
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    // stop the page from scrolling/bouncing while swiping on the board
    if (touchTracking) e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!touchTracking) return;
    touchTracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    if (Math.max(absX, absY) < SWIPE_THRESHOLD) {
      // a tap rather than a swipe: start / pause, same as space bar
      if (!running) startGame(); else togglePause();
      return;
    }

    if (absX > absY) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  // init
  best = loadBest();
  bestEl.textContent = best;
  resetState();
  draw();
  showOverlay('貪食蛇 Snake', '按空白鍵或按下開始遊戲', '開始遊戲 Start');
})();
</script>
</body>
</html>
